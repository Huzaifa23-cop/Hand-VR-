name: Build HandLink APK and Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/build-installers.yml'

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch official Google MediaPipe hand model
        run: |
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' \
            -o android/app/src/main/assets/hand_landmarker.task
          test -s android/app/src/main/assets/hand_landmarker.task
      - name: Build debug signed APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandLink-Camera-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run desktop tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyinstaller
          python -m pytest desktop/tests -q
      - name: Build one-file EXE
        run: pyinstaller --noconfirm --onefile --windowed --clean --name HandLink-Studio desktop/main.py
      - name: Publish Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HandLink-Studio-Windows-EXE
          path: dist/HandLink-Studio.exe
          if-no-files-found: error
